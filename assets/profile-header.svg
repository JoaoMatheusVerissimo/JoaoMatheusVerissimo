<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-labelledby="title description">
  <title id="title">João Matheus Veríssimo Francisco — Full-Stack Developer</title>
  <desc id="description">Banner com animações discretas, fundo em degradê vermelho escuro e elementos visuais inspirados em interfaces de desenvolvimento.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="60%" stop-color="#110000" />
      <stop offset="100%" stop-color="#590000" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3333" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>

    <filter id="softGlow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .content {
        animation: content-enter 900ms cubic-bezier(.22, 1, .36, 1) 120ms both;
      }

      .subtitle {
        animation: text-enter 700ms ease-out 100ms both;
      }

      .name {
        animation: text-enter 750ms ease-out 260ms both;
      }

      .skills {
        animation: text-enter 700ms ease-out 720ms both;
      }

      .separator {
        transform-box: fill-box;
        transform-origin: center;
        animation:
          separator-enter 850ms cubic-bezier(.22, 1, .36, 1) 480ms both,
          separator-glow 4s ease-in-out 1.4s infinite;
      }

      .circuit {
        animation: circuit-draw 1.25s ease-out both;
      }

      .circuit-left {
        animation-delay: 180ms;
      }

      .circuit-right {
        animation-delay: 360ms;
      }

      .point {
        transform-box: fill-box;
        transform-origin: center;
        animation: point-pulse 3.2s ease-in-out infinite;
      }

      .point-right {
        animation-delay: 1.1s;
      }

      .code-mark {
        animation: code-breathe 4.5s ease-in-out infinite;
      }

      .code-mark-left {
        animation-delay: 1.5s;
      }

      @keyframes content-enter {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes text-enter {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes separator-enter {
        from { opacity: 0; transform: scaleX(0); }
        to { opacity: 1; transform: scaleX(1); }
      }

      @keyframes separator-glow {
        0%, 100% { filter: none; opacity: .82; }
        50% { filter: url(#softGlow); opacity: 1; }
      }

      @keyframes circuit-draw {
        from { stroke-dasharray: 1; stroke-dashoffset: 1; }
        to { stroke-dasharray: 1; stroke-dashoffset: 0; }
      }

      @keyframes point-pulse {
        0%, 100% { opacity: .7; transform: scale(.9); }
        50% { opacity: 1; transform: scale(1.18); }
      }

      @keyframes code-breathe {
        0%, 100% { opacity: .55; }
        50% { opacity: .95; }
      }

      @media (prefers-reduced-motion: reduce) {
        .content,
        .subtitle,
        .name,
        .skills,
        .separator,
        .circuit,
        .point,
        .code-mark {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <rect width="800" height="200" rx="12" fill="url(#bgGrad)" />
  <rect width="800" height="200" rx="12" fill="url(#grid)" />

  <circle class="point point-left" cx="50" cy="40" r="4" fill="#ff3333" />
  <path class="circuit circuit-left" pathLength="1" d="M 50 44 L 50 80 A 10 10 0 0 0 60 90 L 90 90" fill="none" stroke="#ff3333" stroke-width="1.5" stroke-opacity="0.7" />

  <circle class="point point-right" cx="750" cy="160" r="4" fill="#ff3333" />
  <path class="circuit circuit-right" pathLength="1" d="M 750 156 L 750 120 A 10 10 0 0 0 740 110 L 710 110" fill="none" stroke="#ff3333" stroke-width="1.5" stroke-opacity="0.7" />

  <text class="code-mark code-mark-right" x="760" y="35" fill="#ff3333" font-family="monospace" font-size="16" font-weight="bold" opacity="0.8">/&gt;</text>
  <text class="code-mark code-mark-left" x="35" y="170" fill="#ff3333" font-family="monospace" font-size="16" font-weight="bold" opacity="0.8">{</text>

  <g class="content" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text class="subtitle" x="400" y="55" fill="#a3a3a3" font-size="12" font-weight="600" letter-spacing="3">FULL-STACK DEVELOPER</text>
    <text class="name" x="400" y="100" fill="#ffffff" font-size="32" font-weight="bold" letter-spacing="-0.5">João Matheus Veríssimo Francisco</text>
    <rect class="separator" x="270" y="120" width="260" height="3" rx="1.5" fill="url(#lineGrad)" />
    <text class="skills" x="400" y="150" fill="#cccccc" font-size="14" font-weight="400">Back-End • Front-End • Dados • DevOps</text>
  </g>
</svg>
