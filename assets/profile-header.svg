<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <!-- Degradê do Fundo: Preto para Vermelho Escuro -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="60%" stop-color="#110000" />
      <stop offset="100%" stop-color="#590000" />
    </linearGradient>

    <!-- Degradê da Linha Central -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3333" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="800" height="200" rx="12" fill="url(#bgGrad)" />

  <!-- Padrão de Grade (Subtil, para manter a estética tech da imagem original) -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  </pattern>
  <rect width="800" height="200" rx="12" fill="url(#grid)" />

  <!-- Decoração Superior Esquerda -->
  <circle cx="50" cy="40" r="4" fill="#ff3333" />
  <path d="M 50 44 L 50 80 A 10 10 0 0 0 60 90 L 90 90" fill="none" stroke="#ff3333" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Decoração Inferior Direita -->
  <circle cx="750" cy="160" r="4" fill="#ff3333" />
  <path d="M 750 156 L 750 120 A 10 10 0 0 0 740 110 L 710 110" fill="none" stroke="#ff3333" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Texto Decorativo Superior Direito -->
  <text x="760" y="35" fill="#ff3333" font-family="monospace" font-size="16" font-weight="bold" opacity="0.8">/&gt;</text>

  <!-- Texto Decorativo Inferior Esquerdo -->
  <text x="35" y="170" fill="#ff3333" font-family="monospace" font-size="16" font-weight="bold" opacity="0.8">{</text>

  <!-- Grupo de Conteúdo Central -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    <!-- Subtítulo -->
    <text x="400" y="55" fill="#a3a3a3" font-size="12" font-weight="600" letter-spacing="3">FULL-STACK DEVELOPER</text>

    <!-- Nome -->
    <text x="400" y="100" fill="#ffffff" font-size="32" font-weight="bold" letter-spacing="-0.5">João Matheus Veríssimo Francisco</text>

    <!-- Linha Separadora -->
    <rect x="270" y="120" width="260" height="3" rx="1.5" fill="url(#lineGrad)" />

    <!-- Habilidades -->
    <text x="400" y="150" fill="#cccccc" font-size="14" font-weight="400">Back-End • Front-End • Dados • DevOps</text>
  </g>
</svg>
