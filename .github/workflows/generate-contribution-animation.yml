name: Gerar animação de contribuições

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Gerar SVG animado
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Gerar animação de contribuições
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JoaoMatheusVerissimo
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff3333&color_dots=#161b22,#3b0a0a,#6e1010,#b91c1c,#ff3333

      - name: Publicar animação na branch output
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
