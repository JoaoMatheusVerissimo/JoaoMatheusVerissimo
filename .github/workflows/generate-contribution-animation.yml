name: Gerar animação de contribuições

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/scripts/generate-contribution-animation.mjs"
      - ".github/workflows/generate-contribution-animation.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Gerar SVG animado
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gerar animação
        run: node .github/scripts/generate-contribution-animation.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: JoaoMatheusVerissimo

      - name: Publicar animação na branch output
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
